# Fixed, so the volume below is the same one wherever this file is run from:
# the default project name is the directory's, and a renamed directory would
# start the mediator on an empty volume with fresh keys.
name: didcomm-mediator

services:
  mediator:
    build:
      context: ..
      dockerfile: mediator/Dockerfile
    image: ghcr.io/estoc-net/didcomm-mediator-ts
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # The DIDs are derived on every start from this URL and the keys kept in
      # the volume. A new URL keeps the keys and the data but gives new DIDs,
      # which clients must be given; a replica-mediation account stays bound
      # to the mediator DID it registered with.
      MEDIATOR_PUBLIC_URL: ${MEDIATOR_PUBLIC_URL:?set MEDIATOR_PUBLIC_URL before first start}
      MEDIATOR_OPEN_REGISTRATION: ${MEDIATOR_OPEN_REGISTRATION:-true}
      MEDIATOR_CORS_ORIGIN: ${MEDIATOR_CORS_ORIGIN:-*}
    volumes:
      - mediator-data:/data

volumes:
  mediator-data:

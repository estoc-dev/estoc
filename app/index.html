<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Estoc</title>
    <meta
      name="description"
      content="An offline-first DIDComm messenger: one identity from one seed, your vault in this browser, a backup file you can walk away with."
    />
    <meta name="theme-color" content="#202b30" />
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        const look = localStorage.getItem("estoc.look");
        if (look === "dark" || look === "light") document.documentElement.dataset.theme = look;
      } catch {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Estoc" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
